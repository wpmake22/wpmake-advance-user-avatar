name: Build release asset
on:
  release:
    types: [published]
jobs:
  build:
    name: Build release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set env
        id: vars
        run: echo ::set-output name=tag::${GITHUB_REF:10}
      # The action runs `composer install` (dev dependencies included, because
      # `npm run build` calls `composer run-script makepot`) inside its own
      # container. That image installs php-curl, php-mbstring and php-xmlrpc but
      # not php-xml or php-zip, so the xml/zip extensions the dev tools require
      # are absent - hence the `ext-*` entries in composer.json's
      # `config.platform`, which let the install resolve. None of those tools are
      # executed during the build, so nothing needs the extensions for real.
      #
      # The GIT_CONFIG_* variables are the container-side equivalent of
      # `git config --global --add safe.directory`: the action runs as root over a
      # checkout owned by the runner user, and a config step on the runner cannot
      # reach the container's HOME.
      - name: Build
        id: build
        uses: wpeverest/action-build@4.0.0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          generate-zip: true
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@master
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ steps.build.outputs.zip_path }}
          asset_name: ${{ github.event.repository.name }}-${{ steps.vars.outputs.tag }}.zip
          asset_content_type: application/zip
